name: Release

# Pushing a tag named like the version (e.g. v1.3.1, 1.3.1, v1.4.0-beta) builds the zip with the BigWigs packager,
# publishes it as a GitHub release and uploads it to CurseForge.
# The tag, without its "v" prefix, must be the version written in the first heading of WeakAuras/CHANGELOG.md:
# that section becomes the CurseForge changelog.
# CurseForge needs the CF_API_KEY repository secret. The upload is done here, not by the packager, so the file is
# tagged with the WoW Forever game version read from "## Interface" (16001 -> 1.60.1) and never with a retail one.
# Wago: the packager uploads with the "## X-Wago-ID" of WeakAuras.toc; skipped while the WAGO_API_TOKEN secret is missing,
# and a rejected token does not stop the CurseForge upload.
# Discord: DISCORD_RELEASE_WEBHOOK gets a short announcement, DISCORD_CHANGELOG_WEBHOOK the changelog section.
# Both must be repository secrets: a variable would print the webhook URL in the public log. A missing one is
# skipped, and a failed post only leaves a warning since the release is already out.

on:
  push:
    tags: ["*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the changelog section and the CurseForge key
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          version="${TAG#v}"
          case "$(head -n1 WeakAuras/CHANGELOG.md) " in
            "# Musca Auras $version "*) ;;
            *) echo "::error::The first heading of WeakAuras/CHANGELOG.md is not for $version"; exit 1 ;;
          esac
          [ -n "$CF_API_KEY" ] || { echo "::error::The CF_API_KEY secret is missing"; exit 1; }

      # A rejected Wago token (401) makes the packager exit 1 after the zip and the GitHub release are made;
      # keep going so CurseForge and Discord are not skipped. The next step still fails if no zip was built.
      - uses: BigWigsMods/packager@v2
        continue-on-error: true
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}

      - name: Upload to CurseForge
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_PROJECT_ID: "1713094"
        run: |
          set -euo pipefail
          api=https://wow.curseforge.com/api
          version="${TAG#v}"

          zip=(.release/*.zip)
          if [ "${#zip[@]}" -ne 1 ] || [ ! -f "${zip[0]}" ]; then
            echo "::error::Expected one zip in .release, found: ${zip[*]}"; exit 1
          fi

          interface=$(sed -n 's/^## Interface: *\([0-9]*\).*/\1/p' WeakAuras/WeakAuras.toc)
          game_version="$((interface / 10000)).$((interface / 100 % 100)).$((interface % 100))"
          game_version_ids=$(curl -sS --fail-with-body -H "X-Api-Token: $CF_API_KEY" "$api/game/versions" \
            | jq -c --arg name "$game_version" '[.[] | select(.name == $name) | .id]')
          if [ "$game_version_ids" = "[]" ]; then
            echo "::error::CurseForge has no game version named $game_version"; exit 1
          fi

          case "$TAG" in
            *alpha*) release_type=alpha ;;
            *beta*) release_type=beta ;;
            *) release_type=release ;;
          esac

          metadata=$(jq -n \
            --arg changelog "$(awk '/^# /{n++} n==1' WeakAuras/CHANGELOG.md)" \
            --arg name "Musca Auras $version" \
            --arg type "$release_type" \
            --argjson versions "$game_version_ids" \
            '{changelog: $changelog, changelogType: "markdown", displayName: $name, gameVersions: $versions, releaseType: $type}')

          curl -sS --fail-with-body -H "X-Api-Token: $CF_API_KEY" \
            --form-string "metadata=$metadata" -F "file=@${zip[0]}" \
            "$api/projects/$CF_PROJECT_ID/upload-file"

      - name: Announce on Discord
        env:
          RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          CHANGELOG_WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          title="Musca Auras $version"
          url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          links=$'CurseForge: <https://www.curseforge.com/wow/addons/musca-auras>\nWago: <https://addons.wago.io/addons/musca-auras>'
          post() { curl -sS --fail-with-body -H "Content-Type: application/json" -d @- "$1"; }

          if [ -n "$RELEASE_WEBHOOK" ]; then
            jq -n --arg content "**$title** is out: $url"$'\n'"$links" '{content: $content}' | post "$RELEASE_WEBHOOK" \
              || echo "::warning::Discord release announcement failed"
          else
            echo "::warning::DISCORD_RELEASE_WEBHOOK is missing, release announcement skipped"
          fi

          if [ -n "$CHANGELOG_WEBHOOK" ]; then
            notes=$(awk '/^# /{n++} n==1' WeakAuras/CHANGELOG.md | tail -n +2)
            jq -n --arg title "$title" --arg url "$url" --arg notes "$notes" --arg links "$links" \
              '{embeds: [{title: $title, url: $url, description: ($notes[:3800] + "\n\n" + $links)}]}' \
              | post "$CHANGELOG_WEBHOOK" \
              || echo "::warning::Discord changelog post failed"
          else
            echo "::warning::DISCORD_CHANGELOG_WEBHOOK is missing, changelog post skipped"
          fi
